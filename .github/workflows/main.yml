          <a class="buy-btn" href="https://www.paypal.com/ncp/payment/PLB-8C2KZ9BUCZXR" target="_blank" rel="noopener">
            Buy with PayPal
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
