<section class="how" id="how">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">How it works</span>
      <h2>Three steps to less guesswork</h2>
    </div>
    <div class="steps">
      <div class="step">
        <div class="mark">i</div>
        <h4>Choose a template</h4>
        <p>Pick the one you need, or save with the complete bundle.</p>
      </div>
      <div class="step">
        <div class="mark">ii</div>
        <h4>Pay securely</h4>
        <p>Checkout runs through PayPal — no account required to pay.</p>
      </div>
      <div class="step">
        <div class="mark">iii</div>
        <h4>Start planning</h4>
        <p>Get instant access and start tracking real numbers today.</p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="brand">Aisle <em>Honest</em></div>
  <p class="fine">Digital templates delivered instantly after purchase. All payments processed securely by <strong>PayPal</strong>. Questions about an order? Reach out any time.</p>
